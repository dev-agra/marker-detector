<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DataMatrix Detector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #141414; --border: #222;
    --accent: #00e5a0; --text: #f0f0f0; --muted: #555;
  }
  html, body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100dvh; }

  #header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #header h1 { font-size: 15px; font-weight: 600; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .2s; }

  #cam-wrap { position: relative; flex: 1; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

  /* Guide box */
  #guide { position: absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: min(70vw,280px); height: min(70vw,280px); pointer-events:none; }
  .gc { position:absolute; width:24px; height:24px; border-color:rgba(255,255,255,.5); border-style:solid; }
  .gc.tl{top:0;left:0;border-width:2px 0 0 2px;border-radius:3px 0 0 0}
  .gc.tr{top:0;right:0;border-width:2px 2px 0 0;border-radius:0 3px 0 0}
  .gc.bl{bottom:0;left:0;border-width:0 0 2px 2px;border-radius:0 0 0 3px}
  .gc.br{bottom:0;right:0;border-width:0 2px 2px 0;border-radius:0 0 3px 0}

  #panel { background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; }

  #timing { display:flex; align-items:center; gap:4px; padding:10px 16px;
    border-bottom:1px solid var(--border); font-size:12px; min-height:38px; }
  .tl { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); min-width:48px; }
  .tv { font-family:monospace; font-size:13px; color:var(--text); min-width:54px; }
  .tv.green { color:var(--accent); }
  #fps { margin-left:auto; font-size:11px; font-family:monospace; color:var(--muted); }

  #dbg { padding:5px 16px; font-size:11px; font-family:monospace;
    color:var(--muted); border-bottom:1px solid var(--border); min-height:26px; }

  #result-area { display:flex; align-items:center; gap:16px; padding:14px 16px; min-height:120px; }
  #empty { display:flex; flex-direction:column; align-items:center; gap:6px;
    color:var(--muted); font-size:13px; width:100%; }
  #empty-icon { font-size:28px; opacity:.25; }
  #crop-canvas { width:100px; height:100px; border:1px solid var(--border);
    border-radius:6px; image-rendering:pixelated; display:none; }
  #info { flex:1; display:flex; flex-direction:column; gap:7px; display:none; }
  .ir { display:flex; flex-direction:column; gap:2px; }
  .il { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); }
  .iv { font-size:13px; font-family:monospace; color:var(--text); }
  .iv.g { color:var(--accent); }

  #proc-c { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>DataMatrix Detector</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="stxt" style="font-size:12px;color:var(--muted)">Starting…</span>
      <div id="dot"></div>
    </div>
  </div>

  <div id="cam-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="guide">
      <div class="gc tl"></div><div class="gc tr"></div>
      <div class="gc bl"></div><div class="gc br"></div>
    </div>
  </div>

  <div id="panel">
    <div id="timing">
      <span class="tl">Threshold</span><span class="tv" id="t0">—</span>
      <span class="tl">Detect</span><span class="tv" id="t1">—</span>
      <span class="tl">Warp</span><span class="tv" id="t2">—</span>
      <span class="tl">Total</span><span class="tv green" id="tt">—</span>
      <span id="fps">— fps</span>
    </div>
    <div id="dbg">Waiting…</div>
    <div id="result-area">
      <div id="empty"><div id="empty-icon">◻</div><span>Point at DataMatrix marker</span></div>
      <canvas id="crop-canvas" width="200" height="200"></canvas>
      <div id="info">
        <div class="ir"><span class="il">Corners</span><span class="iv" id="i-corners">—</span></div>
        <div class="ir"><span class="il">Size in frame</span><span class="iv" id="i-size">—</span></div>
        <div class="ir"><span class="il">Orientation</span><span class="iv g" id="i-rot">—</span></div>
        <div class="ir"><span class="il">Captured</span><span class="iv" id="i-time">—</span></div>
      </div>
    </div>
  </div>
</div>
<canvas id="proc-c"></canvas>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
// ZXing DataMatrix Detector — ported to plain JS
// Sources: zxing-js/library (Apache License 2.0)
//   core/common/detector/MathUtils.ts
//   core/ResultPoint.ts
//   core/common/detector/WhiteRectangleDetector.ts
//   core/datamatrix/detector/Detector.ts
// ═══════════════════════════════════════════════════════

// ── MathUtils ───────────────────────────────────────────
const MathUtils = {
  round(d) {
    if (isNaN(d)) return 0;
    return (d + (d < 0 ? -0.5 : 0.5)) | 0;
  },
  distance(ax, ay, bx, by) {
    return Math.sqrt((ax-bx)**2 + (ay-by)**2);
  }
};

// ── ResultPoint ─────────────────────────────────────────
class ResultPoint {
  constructor(x, y) { this._x = x; this._y = y; }
  getX() { return this._x; }
  getY() { return this._y; }
  toString() { return `(${this._x.toFixed(1)},${this._y.toFixed(1)})`; }
}

// ── BitMatrix ────────────────────────────────────────────
// Backed by a plain Uint8Array where 1 = black, 0 = white
// ZXing's .get(x,y) returns true for black
class BitMatrix {
  constructor(width, height, data) {
    this.width  = width;
    this.height = height;
    // data is Uint8Array: 1=black, 0=white
    this._data  = data || new Uint8Array(width * height);
  }
  get(x, y) {
    if (x < 0 || x >= this.width || y < 0 || y >= this.height) return false;
    return this._data[y * this.width + x] === 1;
  }
  set(x, y) { this._data[y * this.width + x] = 1; }
  getWidth()  { return this.width;  }
  getHeight() { return this.height; }
}

// ── NotFoundException ────────────────────────────────────
class NotFoundException extends Error {
  constructor(msg) { super(msg || 'NotFoundException'); }
}

// ── WhiteRectangleDetector ───────────────────────────────
// Direct port of zxing-js WhiteRectangleDetector.ts
class WhiteRectangleDetector {
  constructor(image, initSize, x, y) {
    this.image  = image;
    this.height = image.getHeight();
    this.width  = image.getWidth();
    if (initSize == null) initSize = 10;
    if (x == null) x = (image.getWidth()  / 2) | 0;
    if (y == null) y = (image.getHeight() / 2) | 0;
    const half = (initSize / 2) | 0;
    this.leftInit  = x - half;
    this.rightInit = x + half;
    this.upInit    = y - half;
    this.downInit  = y + half;
    if (this.upInit < 0 || this.leftInit < 0 ||
        this.downInit >= this.height || this.rightInit >= this.width) {
      throw new NotFoundException('initSize too large');
    }
  }

  detect() {
    let left = this.leftInit, right = this.rightInit;
    let up   = this.upInit,   down  = this.downInit;
    let sizeExceeded = false;
    let aBlack = true, atLeastOne = false;
    let onR=false, onB=false, onL=false, onT=false;
    const { width, height } = this;

    while (aBlack) {
      aBlack = false;

      let rNotWhite = true;
      while ((rNotWhite || !onR) && right < width) {
        rNotWhite = this._containsBlack(up, down, right, false);
        if (rNotWhite) { right++; aBlack=true; onR=true; }
        else if (!onR) right++;
      }
      if (right >= width) { sizeExceeded=true; break; }

      let bNotWhite = true;
      while ((bNotWhite || !onB) && down < height) {
        bNotWhite = this._containsBlack(left, right, down, true);
        if (bNotWhite) { down++; aBlack=true; onB=true; }
        else if (!onB) down++;
      }
      if (down >= height) { sizeExceeded=true; break; }

      let lNotWhite = true;
      while ((lNotWhite || !onL) && left >= 0) {
        lNotWhite = this._containsBlack(up, down, left, false);
        if (lNotWhite) { left--; aBlack=true; onL=true; }
        else if (!onL) left--;
      }
      if (left < 0) { sizeExceeded=true; break; }

      let tNotWhite = true;
      while ((tNotWhite || !onT) && up >= 0) {
        tNotWhite = this._containsBlack(left, right, up, true);
        if (tNotWhite) { up--; aBlack=true; onT=true; }
        else if (!onT) up--;
      }
      if (up < 0) { sizeExceeded=true; break; }

      if (aBlack) atLeastOne = true;
    }

    if (!sizeExceeded && atLeastOne) {
      const maxSize = right - left;
      let z = null;
      for (let i=1; z===null && i<maxSize; i++)
        z = this._blackOnSegment(left, down-i, left+i, down);
      if (!z) throw new NotFoundException('z');

      let t = null;
      for (let i=1; t===null && i<maxSize; i++)
        t = this._blackOnSegment(left, up+i, left+i, up);
      if (!t) throw new NotFoundException('t');

      let x = null;
      for (let i=1; x===null && i<maxSize; i++)
        x = this._blackOnSegment(right, up+i, right-i, up);
      if (!x) throw new NotFoundException('x');

      let y = null;
      for (let i=1; y===null && i<maxSize; i++)
        y = this._blackOnSegment(right, down-i, right-i, down);
      if (!y) throw new NotFoundException('y');

      return this._centerEdges(y, z, x, t);
    }
    throw new NotFoundException('no border');
  }

  _blackOnSegment(ax, ay, bx, by) {
    const dist = MathUtils.round(MathUtils.distance(ax, ay, bx, by));
    const xs = (bx-ax)/dist, ys = (by-ay)/dist;
    for (let i=0; i<dist; i++) {
      const x = MathUtils.round(ax + i*xs);
      const y = MathUtils.round(ay + i*ys);
      if (this.image.get(x, y)) return new ResultPoint(x, y);
    }
    return null;
  }

  _centerEdges(y, z, x, t) {
    const C = 1;
    const yi = y.getX();
    if (yi < this.width / 2) {
      return [
        new ResultPoint(t.getX()-C, t.getY()+C),
        new ResultPoint(z.getX()+C, z.getY()+C),
        new ResultPoint(x.getX()-C, x.getY()-C),
        new ResultPoint(y.getX()+C, y.getY()-C),
      ];
    } else {
      return [
        new ResultPoint(t.getX()+C, t.getY()+C),
        new ResultPoint(z.getX()+C, z.getY()-C),
        new ResultPoint(x.getX()-C, x.getY()+C),
        new ResultPoint(y.getX()-C, y.getY()-C),
      ];
    }
  }

  _containsBlack(a, b, fixed, horizontal) {
    if (horizontal) {
      for (let x=a; x<=b; x++) if (this.image.get(x, fixed)) return true;
    } else {
      for (let y=a; y<=b; y++) if (this.image.get(fixed, y)) return true;
    }
    return false;
  }
}

// ── DataMatrix Detector ──────────────────────────────────
// Direct port of zxing-js datamatrix/detector/Detector.ts
// Only change: detect() returns corners instead of sampling bits
class DMDetector {
  constructor(image) {
    this.image = image;
    this.rectDetector = new WhiteRectangleDetector(image);
  }

  // Returns { topLeft, bottomLeft, bottomRight, topRight } ResultPoints
  detectCorners() {
    const cp = this.rectDetector.detect();
    let pts = this._detectSolid1(cp);
    pts = this._detectSolid2(pts);
    pts[3] = this._correctTopRight(pts);
    if (!pts[3]) throw new NotFoundException('correctTopRight failed');
    pts = this._shiftToModuleCenter(pts);
    return {
      topLeft:     pts[0],
      bottomLeft:  pts[1],
      bottomRight: pts[2],
      topRight:    pts[3],
    };
  }

  static _shiftPoint(pt, to, div) {
    const x = (to.getX() - pt.getX()) / (div+1);
    const y = (to.getY() - pt.getY()) / (div+1);
    return new ResultPoint(pt.getX()+x, pt.getY()+y);
  }

  static _moveAway(pt, fx, fy) {
    let x = pt.getX(), y = pt.getY();
    if (x < fx) x--; else x++;
    if (y < fy) y--; else y++;
    return new ResultPoint(x, y);
  }

  _detectSolid1(cp) {
    let pA=cp[0], pB=cp[1], pC=cp[3], pD=cp[2];
    const trAB = this._transitions(pA,pB);
    const trBC = this._transitions(pB,pC);
    const trCD = this._transitions(pC,pD);
    const trDA = this._transitions(pD,pA);
    let min=trAB, pts=[pD,pA,pB,pC];
    if (min>trBC) { min=trBC; pts=[pA,pB,pC,pD]; }
    if (min>trCD) { min=trCD; pts=[pB,pC,pD,pA]; }
    if (min>trDA) {           pts=[pC,pD,pA,pB]; }
    return pts;
  }

  _detectSolid2(pts) {
    let [pA,pB,pC,pD] = pts;
    const tr  = this._transitions(pA,pD);
    const pBs = DMDetector._shiftPoint(pB,pC,(tr+1)*4);
    const pCs = DMDetector._shiftPoint(pC,pB,(tr+1)*4);
    const trBA = this._transitions(pBs,pA);
    const trCD = this._transitions(pCs,pD);
    return trBA<trCD ? [pA,pB,pC,pD] : [pB,pC,pD,pA];
  }

  _correctTopRight(pts) {
    let [pA,pB,pC,pD] = pts;
    let trTop   = this._transitions(pA,pD);
    let trRight = this._transitions(pB,pD);
    const pAs = DMDetector._shiftPoint(pA,pB,(trRight+1)*4);
    const pCs = DMDetector._shiftPoint(pC,pB,(trTop+1)*4);
    trTop   = this._transitions(pAs,pD);
    trRight = this._transitions(pCs,pD);
    const c1 = new ResultPoint(pD.getX()+(pC.getX()-pB.getX())/(trTop+1),
                                pD.getY()+(pC.getY()-pB.getY())/(trTop+1));
    const c2 = new ResultPoint(pD.getX()+(pA.getX()-pB.getX())/(trRight+1),
                                pD.getY()+(pA.getY()-pB.getY())/(trRight+1));
    const v1=this._isValid(c1), v2=this._isValid(c2);
    if (!v1 && !v2) return null;
    if (!v1) return c2;
    if (!v2) return c1;
    const s1 = this._transitions(pAs,c1)+this._transitions(pCs,c1);
    const s2 = this._transitions(pAs,c2)+this._transitions(pCs,c2);
    return s1>s2 ? c1 : c2;
  }

  _shiftToModuleCenter(pts) {
    let [pA,pB,pC,pD] = pts;
    let dimH = this._transitions(pA,pD)+1;
    let dimV = this._transitions(pC,pD)+1;
    let pAs = DMDetector._shiftPoint(pA,pB,dimV*4);
    let pCs = DMDetector._shiftPoint(pC,pB,dimH*4);
    dimH = this._transitions(pAs,pD)+1;
    dimV = this._transitions(pCs,pD)+1;
    if (dimH&1) dimH++;
    if (dimV&1) dimV++;
    const cx=(pA.getX()+pB.getX()+pC.getX()+pD.getX())/4;
    const cy=(pA.getY()+pB.getY()+pC.getY()+pD.getY())/4;
    pA=DMDetector._moveAway(pA,cx,cy);
    pB=DMDetector._moveAway(pB,cx,cy);
    pC=DMDetector._moveAway(pC,cx,cy);
    pD=DMDetector._moveAway(pD,cx,cy);
    pAs = DMDetector._shiftPoint(DMDetector._shiftPoint(pA,pB,dimV*4),pD,dimH*4);
    const pBs = DMDetector._shiftPoint(DMDetector._shiftPoint(pB,pA,dimV*4),pC,dimH*4);
    pCs = DMDetector._shiftPoint(DMDetector._shiftPoint(pC,pD,dimV*4),pB,dimH*4);
    const pDs = DMDetector._shiftPoint(DMDetector._shiftPoint(pD,pC,dimV*4),pA,dimH*4);
    return [pAs,pBs,pCs,pDs];
  }

  _isValid(p) {
    return p.getX()>=0 && p.getX()<this.image.getWidth() &&
           p.getY()>0  && p.getY()<this.image.getHeight();
  }

  // Bresenham transition count — exact ZXing port
  _transitions(from, to) {
    let fx=Math.trunc(from.getX()), fy=Math.trunc(from.getY());
    let tx=Math.trunc(to.getX()),   ty=Math.trunc(to.getY());
    let steep = Math.abs(ty-fy) > Math.abs(tx-fx);
    if (steep) { [fx,fy]=[fy,fx]; [tx,ty]=[ty,tx]; }
    const dx=Math.abs(tx-fx), dy=Math.abs(ty-fy);
    let error=-dx/2, ystep=fy<ty?1:-1, xstep=fx<tx?1:-1;
    let transitions=0;
    let inBlack = this.image.get(steep?fy:fx, steep?fx:fy);
    for (let x=fx,y=fy; x!==tx; x+=xstep) {
      const isBlack = this.image.get(steep?y:x, steep?x:y);
      if (isBlack!==inBlack) { transitions++; inBlack=isBlack; }
      error+=dy;
      if (error>0) { if(y===ty) break; y+=ystep; error-=dx; }
    }
    return transitions;
  }
}

// ═══════════════════════════════════════════════════════
// PERSPECTIVE WARP — inverse homography pixel mapping
// ═══════════════════════════════════════════════════════
function perspectiveWarp(srcImageData, srcW, srcH, corners, outSize) {
  // corners = [tl,tr,br,bl] each {x,y}
  const [tl,tr,br,bl] = corners;
  // Build H: src quad -> dst square [0..outSize]
  // Using DLT
  const srcPts = [[tl.x,tl.y],[tr.x,tr.y],[br.x,br.y],[bl.x,bl.y]];
  const dstPts = [[0,0],[outSize,0],[outSize,outSize],[0,outSize]];
  const A = [];
  for (let i=0; i<4; i++) {
    const [sx,sy]=srcPts[i], [dx,dy]=dstPts[i];
    A.push([-sx,-sy,-1, 0,  0,  0, dx*sx, dx*sy, dx]);
    A.push([ 0,  0,  0,-sx,-sy,-1, dy*sx, dy*sy, dy]);
  }
  const h = _gaussElim(A);
  if (!h) return null;
  // H = [h0..h7, 1]
  const H = [...h, 1];

  // Compute inverse of H
  const [h0,h1,h2,h3,h4,h5,h6,h7,h8] = H;
  const det = h0*(h4*h8-h5*h7) - h1*(h3*h8-h5*h6) + h2*(h3*h7-h4*h6);
  if (Math.abs(det)<1e-10) return null;
  const inv = [
    (h4*h8-h5*h7)/det, (h2*h7-h1*h8)/det, (h1*h5-h2*h4)/det,
    (h5*h6-h3*h8)/det, (h0*h8-h2*h6)/det, (h2*h3-h0*h5)/det,
    (h3*h7-h4*h6)/det, (h1*h6-h0*h7)/det, (h0*h4-h1*h3)/det,
  ];

  const sd = srcImageData.data;
  const dst = new ImageData(outSize, outSize);
  const dd = dst.data;

  for (let dy=0; dy<outSize; dy++) {
    for (let dx=0; dx<outSize; dx++) {
      const w2 = inv[6]*dx + inv[7]*dy + inv[8];
      const sx = (inv[0]*dx + inv[1]*dy + inv[2]) / w2;
      const sy = (inv[3]*dx + inv[4]*dy + inv[5]) / w2;
      const six=Math.round(sx), siy=Math.round(sy);
      if (six>=0 && six<srcW && siy>=0 && siy<srcH) {
        const si=(siy*srcW+six)*4, di=(dy*outSize+dx)*4;
        dd[di]=sd[si]; dd[di+1]=sd[si+1]; dd[di+2]=sd[si+2]; dd[di+3]=255;
      }
    }
  }
  return dst;
}

function _gaussElim(A) {
  const n=A.length;
  for (let col=0; col<n; col++) {
    let maxR=col;
    for (let r=col+1; r<n; r++)
      if (Math.abs(A[r][col])>Math.abs(A[maxR][col])) maxR=r;
    [A[col],A[maxR]]=[A[maxR],A[col]];
    const piv=A[col][col];
    if (Math.abs(piv)<1e-10) return null;
    for (let r=0; r<n; r++) {
      if (r===col) continue;
      const f=A[r][col]/piv;
      for (let c=col; c<=n; c++) A[r][c]-=f*A[col][c];
    }
    for (let c=col; c<=n; c++) A[col][c]/=piv;
  }
  return A.map(r=>r[n]);
}

// ═══════════════════════════════════════════════════════
// BINARISATION — Otsu global threshold
// ZXing uses HybridBinarizer (local) but Otsu is robust enough
// for a well-printed DataMatrix with sufficient contrast
// ═══════════════════════════════════════════════════════
function otsuThreshold(grey, w, h) {
  const hist = new Int32Array(256);
  for (let i=0; i<grey.length; i++) hist[grey[i]]++;
  const total = w*h;
  let sum=0;
  for (let i=0; i<256; i++) sum+=i*hist[i];
  let sumB=0, wB=0, max=0, thresh=0;
  for (let t=0; t<256; t++) {
    wB+=hist[t]; if(!wB) continue;
    const wF=total-wB; if(!wF) break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if (between>max) { max=between; thresh=t; }
  }
  return thresh;
}

function toBitMatrix(grey, w, h, thresh) {
  const data = new Uint8Array(w*h);
  for (let i=0; i<grey.length; i++) data[i] = grey[i]<=thresh ? 1 : 0;
  return new BitMatrix(w, h, data);
}

function toGrey(imageData) {
  const { data, width, height } = imageData;
  const out = new Uint8Array(width*height);
  for (let i=0; i<out.length; i++) {
    const o=i*4;
    out[i] = (data[o]*77 + data[o+1]*150 + data[o+2]*29) >> 8;
  }
  return out;
}

// ═══════════════════════════════════════════════════════
// ORIENTATION — use L-corner (solid sides = fewer transitions)
// ═══════════════════════════════════════════════════════
function detectOrientation(corners) {
  // DMDetector already finds orientation via solid side detection
  // topLeft = corner of the L (two solid sides meet there for standard DM)
  // The corners returned are already canonical: TL, BL, BR, TR
  return 'L-corner at TL (canonical DataMatrix orientation)';
}

// ═══════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════
const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const oCtx    = overlay.getContext('2d');
const procC   = document.getElementById('proc-c');
const pCtx    = procC.getContext('2d', { willReadFrequently: true });
const cropC   = document.getElementById('crop-canvas');
const cCtx    = cropC.getContext('2d');

const PROC_W=480, PROC_H=270, OUT_SZ=200;
procC.width=PROC_W; procC.height=PROC_H;

let fCount=0, lastFPS=0, lastFPSt=0;
let missCount=0;

// ═══════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════
async function startCamera() {
  setStatus('Requesting camera…','#555');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });
    video.srcObject = stream;
    await new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true}));
    await video.play();
    setStatus('Scanning…','#ffaa00');
    requestAnimationFrame(loop);
  } catch(e) {
    setStatus('Camera error: '+e.message,'#ff4444');
  }
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(ts) {
  requestAnimationFrame(loop);

  // FPS
  fCount++;
  if (ts-lastFPSt >= 1000) {
    lastFPS=fCount; fCount=0; lastFPSt=ts;
    document.getElementById('fps').textContent=lastFPS+' fps';
  }

  const cr = document.getElementById('cam-wrap').getBoundingClientRect();
  overlay.width=cr.width; overlay.height=cr.height;

  if (video.readyState < 2) return;

  const vw=video.videoWidth, vh=video.videoHeight;
  const t0=performance.now();

  // ── 1. Downsample to PROC size ──
  const sc=Math.min(PROC_W/vw, PROC_H/vh);
  const sw=Math.round(vw*sc), sh=Math.round(vh*sc);
  pCtx.drawImage(video, 0, 0, sw, sh);
  const frame = pCtx.getImageData(0, 0, sw, sh);

  // ── 2. Greyscale + Otsu threshold → BitMatrix ──
  const grey   = toGrey(frame);
  const thresh = otsuThreshold(grey, sw, sh);
  const bitmat = toBitMatrix(grey, sw, sh, thresh);
  const t1=performance.now();
  setTime('t0', t1-t0);

  // ── 3. ZXing DataMatrix corner detection ──
  let corners = null;
  try {
    const detector = new DMDetector(bitmat);
    const result   = detector.detectCorners();
    corners = result;
  } catch(e) {
    dbg('ZXing: '+e.message);
    missCount++;
    if (missCount>5) clearResult();
    setTime('t1',performance.now()-t1);
    return;
  }
  const t2=performance.now();
  missCount=0;
  setTime('t1', t2-t1);
  dbg('Found — TL=('+fmt(corners.topLeft)+') TR=('+fmt(corners.topRight)+')');

  // Scale corners back to video coords
  const isc=1/sc;
  const tl={x:corners.topLeft.getX()*isc,     y:corners.topLeft.getY()*isc};
  const tr={x:corners.topRight.getX()*isc,    y:corners.topRight.getY()*isc};
  const br={x:corners.bottomRight.getX()*isc, y:corners.bottomRight.getY()*isc};
  const bl={x:corners.bottomLeft.getX()*isc,  y:corners.bottomLeft.getY()*isc};

  // Draw overlay on screen
  const dsx=cr.width/vw, dsy=cr.height/vh;
  drawQuad(oCtx,[tl,tr,br,bl],dsx,dsy);

  // ── 4. Perspective warp from full-res frame ──
  // Draw full video to proc canvas at full size temporarily
  const fullC = document.createElement('canvas');
  fullC.width=vw; fullC.height=vh;
  fullC.getContext('2d').drawImage(video,0,0);
  const fullData = fullC.getContext('2d').getImageData(0,0,vw,vh);

  const warped = perspectiveWarp(fullData, vw, vh, [tl,tr,br,bl], OUT_SZ);
  const t3=performance.now();
  setTime('t2',t3-t2);
  setTime('tt',t3-t0);

  if (warped) {
    cCtx.putImageData(warped,0,0);
    showResult(corners, tl, tr, br, bl);
  }
}

// ═══════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════
function drawQuad(ctx, pts, sx, sy) {
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  const scaled = pts.map(p=>({x:p.x*sx, y:p.y*sy}));
  const t=(Date.now()%800)/800;
  ctx.save();
  ctx.setLineDash([8,4]);
  ctx.lineDashOffset=-t*24;
  ctx.strokeStyle='#00e5a0';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(scaled[0].x, scaled[0].y);
  for(let i=1;i<scaled.length;i++) ctx.lineTo(scaled[i].x,scaled[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#00e5a0';
  scaled.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}

function showResult(corners, tl, tr, br, bl) {
  document.getElementById('empty').style.display='none';
  cropC.style.display='block';
  document.getElementById('info').style.display='flex';
  const sz=Math.round(MathUtils.distance(tl.x,tl.y,tr.x,tr.y));
  document.getElementById('i-corners').textContent=
    `TL(${Math.round(tl.x)},${Math.round(tl.y)})`;
  document.getElementById('i-size').textContent=sz+'px wide';
  document.getElementById('i-rot').textContent='Canonical (ZXing L-corner)';
  document.getElementById('i-time').textContent=
    new Date().toLocaleTimeString('en-GB',{hour12:false});
  setStatus('Detected','#00e5a0');
}

function clearResult() {
  document.getElementById('empty').style.display='flex';
  cropC.style.display='none';
  document.getElementById('info').style.display='none';
  oCtx.clearRect(0,0,overlay.width,overlay.height);
  setStatus('Scanning…','#ffaa00');
}

function setStatus(txt,col) {
  document.getElementById('stxt').textContent=txt;
  document.getElementById('dot').style.background=col;
}

function setTime(id, ms) {
  const el=document.getElementById(id);
  if (el) el.textContent = ms!=null ? ms.toFixed(1)+'ms' : '—';
}

function dbg(msg) { document.getElementById('dbg').textContent=msg; }
function fmt(rp) { return Math.round(rp.getX())+','+Math.round(rp.getY()); }

// ── Boot ──
startCamera();
</script>
