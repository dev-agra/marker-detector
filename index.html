<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DataMatrix Detector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #141414; --border: #222;
    --accent: #00e5a0; --text: #f0f0f0; --muted: #555;
  }
  html, body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100dvh; }

  #header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #header h1 { font-size: 15px; font-weight: 600; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .2s; }

  #cam-wrap { position: relative; flex: 1; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

  /* Guide box */
  #guide { position: absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: min(70vw,280px); height: min(70vw,280px); pointer-events:none; }
  .gc { position:absolute; width:24px; height:24px; border-color:rgba(255,255,255,.5); border-style:solid; }
  .gc.tl{top:0;left:0;border-width:2px 0 0 2px;border-radius:3px 0 0 0}
  .gc.tr{top:0;right:0;border-width:2px 2px 0 0;border-radius:0 3px 0 0}
  .gc.bl{bottom:0;left:0;border-width:0 0 2px 2px;border-radius:0 0 0 3px}
  .gc.br{bottom:0;right:0;border-width:0 2px 2px 0;border-radius:0 0 3px 0}

  #panel { background:var(--surface); border-top:1px solid var(--border); flex-shrink:0;
    max-height:44vh; overflow-y:auto; }
  #cam-wrap { min-height:120px; }

  #timing { display:flex; align-items:center; gap:4px; padding:10px 16px;
    border-bottom:1px solid var(--border); font-size:12px; min-height:38px; }
  .tl { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); min-width:48px; }
  .tv { font-family:monospace; font-size:13px; color:var(--text); min-width:54px; }
  .tv.green { color:var(--accent); }
  #fps { margin-left:auto; font-size:11px; font-family:monospace; color:var(--muted); }

  #dbg { padding:5px 16px; font-size:11px; font-family:monospace;
    color:var(--muted); border-bottom:1px solid var(--border); min-height:26px; }

  #capture-progress { padding:10px 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px; }
  #capture-bar-track { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  #capture-bar-fill { height:100%; width:0%; background:var(--accent);
    border-radius:3px; transition:width .15s ease; }
  #capture-progress-text { font-size:11px; font-family:monospace; color:var(--accent);
    white-space:nowrap; min-width:110px; }

  #result-area { display:flex; align-items:center; gap:16px; padding:14px 16px; min-height:120px;
    flex-wrap:wrap; position:relative; }
  #empty { display:flex; flex-direction:column; align-items:center; gap:6px;
    color:var(--muted); font-size:13px; width:100%; }
  #empty-icon { font-size:28px; opacity:.25; }
  #crop-canvas { width:100px; height:100px; border:1px solid var(--accent);
    border-radius:6px; image-rendering:pixelated; display:none; box-shadow:0 0 0 3px rgba(0,229,160,0.15); }
  #info { flex:1; display:flex; flex-direction:column; gap:7px; display:none; min-width:140px; }
  .ir { display:flex; flex-direction:column; gap:2px; }
  .il { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); }
  .iv { font-size:13px; font-family:monospace; color:var(--text); }
  .iv.g { color:var(--accent); }
  #reset-btn { width:100%; margin-top:4px; padding:9px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; color:var(--text);
    font-size:13px; font-family:inherit; cursor:pointer; }
  #reset-btn:active { background:var(--border); }

  #proc-c { display:none; }

  #debug-panel { border-top:1px solid var(--border); padding:8px 16px 10px; flex-shrink:0; }
  #debug-panel-body { display:flex; gap:10px; align-items:flex-start; }
  #debug-panel-header { display:flex; flex-direction:column; gap:4px; padding-top:2px; }
  #debug-legend { display:flex; flex-direction:column; gap:4px; }
  .lg { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text); }
  .sw { width:9px; height:9px; border-radius:2px; display:inline-block; flex-shrink:0; }
  .sw.solid { background:#00e5a0; }
  .sw.alt   { background:#3ea6ff; }
  .sw.bad   { background:#ff4444; }
  #debug-canvas { width:110px; height:110px; background:#000;
    border:1px solid var(--border); border-radius:6px; image-rendering:pixelated;
    display:block; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>DataMatrix Detector <span style="font-size:10px;color:var(--muted);font-weight:400">v17</span></h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="stxt" style="font-size:12px;color:var(--muted)">Starting…</span>
      <div id="dot"></div>
    </div>
  </div>

  <div id="cam-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="guide">
      <div class="gc tl"></div><div class="gc tr"></div>
      <div class="gc bl"></div><div class="gc br"></div>
    </div>
  </div>

  <div id="panel">
    <div id="timing">
      <span class="tl">Threshold</span><span class="tv" id="t0">—</span>
      <span class="tl">Detect</span><span class="tv" id="t1">—</span>
      <span class="tl">Warp</span><span class="tv" id="t2">—</span>
      <span class="tl">Total</span><span class="tv green" id="tt">—</span>
      <span id="fps">— fps</span>
    </div>
    <div id="dbg">Waiting…</div>
    <div id="capture-progress" style="display:none">
      <div id="capture-bar-track"><div id="capture-bar-fill"></div></div>
      <span id="capture-progress-text">Capturing 0/15…</span>
    </div>
    <div id="result-area">
      <div id="empty"><div id="empty-icon">◻</div><span>Point at DataMatrix marker</span></div>
      <canvas id="crop-canvas" width="200" height="200"></canvas>
      <div id="info">
        <div class="ir"><span class="il">Corners</span><span class="iv" id="i-corners">—</span></div>
        <div class="ir"><span class="il">Size in frame</span><span class="iv" id="i-size">—</span></div>
        <div class="ir"><span class="il">Orientation</span><span class="iv g" id="i-rot">—</span></div>
        <div class="ir"><span class="il">Captured</span><span class="iv" id="i-time">—</span></div>
      </div>
      <button id="reset-btn" style="display:none">Scan again</button>
    </div>
  </div>

  <div id="debug-panel">
    <div id="debug-panel-body">
      <canvas id="debug-canvas" width="150" height="150"></canvas>
      <div id="debug-panel-header">
        <span id="debug-legend">
          <span class="lg"><span class="sw solid"></span>solid</span>
          <span class="lg"><span class="sw alt"></span>alternating</span>
          <span class="lg"><span class="sw bad"></span>other/empty</span>
        </span>
        <span id="debug-zoom-label" style="color:var(--muted);font-size:10px;margin-top:6px">zoomed to candidate region</span>
      </div>
    </div>
  </div>
</div>
<canvas id="proc-c"></canvas>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
// ZXing DataMatrix Detector — ported to plain JS
// Sources: zxing-js/library (Apache License 2.0)
//   core/common/detector/MathUtils.ts
//   core/ResultPoint.ts
//   core/common/detector/WhiteRectangleDetector.ts
//   core/datamatrix/detector/Detector.ts
// ═══════════════════════════════════════════════════════

// ── MathUtils ───────────────────────────────────────────
const MathUtils = {
  round(d) {
    if (isNaN(d)) return 0;
    return (d + (d < 0 ? -0.5 : 0.5)) | 0;
  },
  distance(ax, ay, bx, by) {
    return Math.sqrt((ax-bx)**2 + (ay-by)**2);
  }
};

// ── ResultPoint ─────────────────────────────────────────
class ResultPoint {
  constructor(x, y) { this._x = x; this._y = y; }
  getX() { return this._x; }
  getY() { return this._y; }
  toString() { return `(${this._x.toFixed(1)},${this._y.toFixed(1)})`; }
}

// ── BitMatrix ────────────────────────────────────────────
// Backed by a plain Uint8Array where 1 = black, 0 = white
// ZXing's .get(x,y) returns true for black
class BitMatrix {
  constructor(width, height, data) {
    this.width  = width;
    this.height = height;
    // data is Uint8Array: 1=black, 0=white
    this._data  = data || new Uint8Array(width * height);
  }
  get(x, y) {
    if (x < 0 || x >= this.width || y < 0 || y >= this.height) return false;
    return this._data[y * this.width + x] === 1;
  }
  set(x, y) { this._data[y * this.width + x] = 1; }
  getWidth()  { return this.width;  }
  getHeight() { return this.height; }
}

// ── NotFoundException ────────────────────────────────────
class NotFoundException extends Error {
  constructor(msg) { super(msg || 'NotFoundException'); }
}

// ── WhiteRectangleDetector ───────────────────────────────
// Direct port of zxing-js WhiteRectangleDetector.ts
class WhiteRectangleDetector {
  constructor(image, initSize, x, y) {
    this.image  = image;
    this.height = image.getHeight();
    this.width  = image.getWidth();
    if (initSize == null) initSize = 10;
    if (x == null) x = (image.getWidth()  / 2) | 0;
    if (y == null) y = (image.getHeight() / 2) | 0;
    const half = (initSize / 2) | 0;
    this.leftInit  = x - half;
    this.rightInit = x + half;
    this.upInit    = y - half;
    this.downInit  = y + half;
    if (this.upInit < 0 || this.leftInit < 0 ||
        this.downInit >= this.height || this.rightInit >= this.width) {
      throw new NotFoundException('initSize too large');
    }
  }

  detect() {
    let left = this.leftInit, right = this.rightInit;
    let up   = this.upInit,   down  = this.downInit;
    let sizeExceeded = false;
    let aBlack = true, atLeastOne = false;
    let onR=false, onB=false, onL=false, onT=false;
    const { width, height } = this;

    while (aBlack) {
      aBlack = false;

      let rNotWhite = true;
      while ((rNotWhite || !onR) && right < width) {
        rNotWhite = this._containsBlack(up, down, right, false);
        if (rNotWhite) { right++; aBlack=true; onR=true; }
        else if (!onR) right++;
      }
      if (right >= width) { sizeExceeded=true; break; }

      let bNotWhite = true;
      while ((bNotWhite || !onB) && down < height) {
        bNotWhite = this._containsBlack(left, right, down, true);
        if (bNotWhite) { down++; aBlack=true; onB=true; }
        else if (!onB) down++;
      }
      if (down >= height) { sizeExceeded=true; break; }

      let lNotWhite = true;
      while ((lNotWhite || !onL) && left >= 0) {
        lNotWhite = this._containsBlack(up, down, left, false);
        if (lNotWhite) { left--; aBlack=true; onL=true; }
        else if (!onL) left--;
      }
      if (left < 0) { sizeExceeded=true; break; }

      let tNotWhite = true;
      while ((tNotWhite || !onT) && up >= 0) {
        tNotWhite = this._containsBlack(left, right, up, true);
        if (tNotWhite) { up--; aBlack=true; onT=true; }
        else if (!onT) up--;
      }
      if (up < 0) { sizeExceeded=true; break; }

      if (aBlack) atLeastOne = true;
    }

    if (!sizeExceeded && atLeastOne) {
      const maxSize = right - left;
      let z = null;
      for (let i=1; z===null && i<maxSize; i++)
        z = this._blackOnSegment(left, down-i, left+i, down);
      if (!z) throw new NotFoundException('z');

      let t = null;
      for (let i=1; t===null && i<maxSize; i++)
        t = this._blackOnSegment(left, up+i, left+i, up);
      if (!t) throw new NotFoundException('t');

      let x = null;
      for (let i=1; x===null && i<maxSize; i++)
        x = this._blackOnSegment(right, up+i, right-i, up);
      if (!x) throw new NotFoundException('x');

      let y = null;
      for (let i=1; y===null && i<maxSize; i++)
        y = this._blackOnSegment(right, down-i, right-i, down);
      if (!y) throw new NotFoundException('y');

      return this._centerEdges(y, z, x, t);
    }
    throw new NotFoundException('no border');
  }

  _blackOnSegment(ax, ay, bx, by) {
    const dist = MathUtils.round(MathUtils.distance(ax, ay, bx, by));
    const xs = (bx-ax)/dist, ys = (by-ay)/dist;
    for (let i=0; i<dist; i++) {
      const x = MathUtils.round(ax + i*xs);
      const y = MathUtils.round(ay + i*ys);
      if (this.image.get(x, y)) return new ResultPoint(x, y);
    }
    return null;
  }

  _centerEdges(y, z, x, t) {
    const C = 1;
    const yi = y.getX();
    if (yi < this.width / 2) {
      return [
        new ResultPoint(t.getX()-C, t.getY()+C),
        new ResultPoint(z.getX()+C, z.getY()+C),
        new ResultPoint(x.getX()-C, x.getY()-C),
        new ResultPoint(y.getX()+C, y.getY()-C),
      ];
    } else {
      return [
        new ResultPoint(t.getX()+C, t.getY()+C),
        new ResultPoint(z.getX()+C, z.getY()-C),
        new ResultPoint(x.getX()-C, x.getY()+C),
        new ResultPoint(y.getX()-C, y.getY()-C),
      ];
    }
  }

  _containsBlack(a, b, fixed, horizontal) {
    if (horizontal) {
      for (let x=a; x<=b; x++) if (this.image.get(x, fixed)) return true;
    } else {
      for (let y=a; y<=b; y++) if (this.image.get(fixed, y)) return true;
    }
    return false;
  }
}

// ── DataMatrix Detector ──────────────────────────────────
// Direct port of zxing-js datamatrix/detector/Detector.ts
// Only change: detect() returns corners instead of sampling bits
class DMDetector {
  constructor(image, initSize, x, y) {
    this.image = image;
    this.rectDetector = new WhiteRectangleDetector(image, initSize || 10, x, y);
  }

  // Returns { topLeft, bottomLeft, bottomRight, topRight } ResultPoints
  detectCorners() {
    const cp = this.rectDetector.detect();
    let pts = this._detectSolid1(cp);
    pts = this._detectSolid2(pts);
    pts[3] = this._correctTopRight(pts);
    if (!pts[3]) throw new NotFoundException('correctTopRight failed');
    pts = this._shiftToModuleCenter(pts);
    return {
      topLeft:     pts[0],
      bottomLeft:  pts[1],
      bottomRight: pts[2],
      topRight:    pts[3],
    };
  }

  static _shiftPoint(pt, to, div) {
    const x = (to.getX() - pt.getX()) / (div+1);
    const y = (to.getY() - pt.getY()) / (div+1);
    return new ResultPoint(pt.getX()+x, pt.getY()+y);
  }

  static _moveAway(pt, fx, fy) {
    let x = pt.getX(), y = pt.getY();
    if (x < fx) x--; else x++;
    if (y < fy) y--; else y++;
    return new ResultPoint(x, y);
  }

  _detectSolid1(cp) {
    let pA=cp[0], pB=cp[1], pC=cp[3], pD=cp[2];
    const trAB = this._transitions(pA,pB);
    const trBC = this._transitions(pB,pC);
    const trCD = this._transitions(pC,pD);
    const trDA = this._transitions(pD,pA);
    let min=trAB, pts=[pD,pA,pB,pC];
    if (min>trBC) { min=trBC; pts=[pA,pB,pC,pD]; }
    if (min>trCD) { min=trCD; pts=[pB,pC,pD,pA]; }
    if (min>trDA) {           pts=[pC,pD,pA,pB]; }
    return pts;
  }

  _detectSolid2(pts) {
    let [pA,pB,pC,pD] = pts;
    const tr  = this._transitions(pA,pD);
    const pBs = DMDetector._shiftPoint(pB,pC,(tr+1)*4);
    const pCs = DMDetector._shiftPoint(pC,pB,(tr+1)*4);
    const trBA = this._transitions(pBs,pA);
    const trCD = this._transitions(pCs,pD);
    return trBA<trCD ? [pA,pB,pC,pD] : [pB,pC,pD,pA];
  }

  _correctTopRight(pts) {
    let [pA,pB,pC,pD] = pts;
    let trTop   = this._transitions(pA,pD);
    let trRight = this._transitions(pB,pD);
    const pAs = DMDetector._shiftPoint(pA,pB,(trRight+1)*4);
    const pCs = DMDetector._shiftPoint(pC,pB,(trTop+1)*4);
    trTop   = this._transitions(pAs,pD);
    trRight = this._transitions(pCs,pD);
    const c1 = new ResultPoint(pD.getX()+(pC.getX()-pB.getX())/(trTop+1),
                                pD.getY()+(pC.getY()-pB.getY())/(trTop+1));
    const c2 = new ResultPoint(pD.getX()+(pA.getX()-pB.getX())/(trRight+1),
                                pD.getY()+(pA.getY()-pB.getY())/(trRight+1));
    const v1=this._isValid(c1), v2=this._isValid(c2);
    if (!v1 && !v2) return null;
    if (!v1) return c2;
    if (!v2) return c1;
    const s1 = this._transitions(pAs,c1)+this._transitions(pCs,c1);
    const s2 = this._transitions(pAs,c2)+this._transitions(pCs,c2);
    return s1>s2 ? c1 : c2;
  }

  _shiftToModuleCenter(pts) {
    let [pA,pB,pC,pD] = pts;
    let dimH = this._transitions(pA,pD)+1;
    let dimV = this._transitions(pC,pD)+1;
    let pAs = DMDetector._shiftPoint(pA,pB,dimV*4);
    let pCs = DMDetector._shiftPoint(pC,pB,dimH*4);
    dimH = this._transitions(pAs,pD)+1;
    dimV = this._transitions(pCs,pD)+1;
    if (dimH&1) dimH++;
    if (dimV&1) dimV++;
    const cx=(pA.getX()+pB.getX()+pC.getX()+pD.getX())/4;
    const cy=(pA.getY()+pB.getY()+pC.getY()+pD.getY())/4;
    pA=DMDetector._moveAway(pA,cx,cy);
    pB=DMDetector._moveAway(pB,cx,cy);
    pC=DMDetector._moveAway(pC,cx,cy);
    pD=DMDetector._moveAway(pD,cx,cy);
    pAs = DMDetector._shiftPoint(DMDetector._shiftPoint(pA,pB,dimV*4),pD,dimH*4);
    const pBs = DMDetector._shiftPoint(DMDetector._shiftPoint(pB,pA,dimV*4),pC,dimH*4);
    pCs = DMDetector._shiftPoint(DMDetector._shiftPoint(pC,pD,dimV*4),pB,dimH*4);
    const pDs = DMDetector._shiftPoint(DMDetector._shiftPoint(pD,pC,dimV*4),pA,dimH*4);
    return [pAs,pBs,pCs,pDs];
  }

  _isValid(p) {
    return p.getX()>=0 && p.getX()<this.image.getWidth() &&
           p.getY()>0  && p.getY()<this.image.getHeight();
  }

  // Bresenham transition count — exact ZXing port
  _transitions(from, to) {
    let fx=Math.trunc(from.getX()), fy=Math.trunc(from.getY());
    let tx=Math.trunc(to.getX()),   ty=Math.trunc(to.getY());
    let steep = Math.abs(ty-fy) > Math.abs(tx-fx);
    if (steep) { [fx,fy]=[fy,fx]; [tx,ty]=[ty,tx]; }
    const dx=Math.abs(tx-fx), dy=Math.abs(ty-fy);
    let error=-dx/2, ystep=fy<ty?1:-1, xstep=fx<tx?1:-1;
    let transitions=0;
    let inBlack = this.image.get(steep?fy:fx, steep?fx:fy);
    for (let x=fx,y=fy; x!==tx; x+=xstep) {
      const isBlack = this.image.get(steep?y:x, steep?x:y);
      if (isBlack!==inBlack) { transitions++; inBlack=isBlack; }
      error+=dy;
      if (error>0) { if(y===ty) break; y+=ystep; error-=dx; }
    }
    return transitions;
  }
}

// ═══════════════════════════════════════════════════════
// PERSPECTIVE WARP — inverse homography pixel mapping
// ═══════════════════════════════════════════════════════
function perspectiveWarp(srcImageData, srcW, srcH, corners, outSize) {
  // corners = [tl,tr,br,bl] each {x,y}
  const [tl,tr,br,bl] = corners;
  // Build H: src quad -> dst square [0..outSize]
  // Using DLT
  const srcPts = [[tl.x,tl.y],[tr.x,tr.y],[br.x,br.y],[bl.x,bl.y]];
  const dstPts = [[0,0],[outSize,0],[outSize,outSize],[0,outSize]];
  const A = [];
  for (let i=0; i<4; i++) {
    const [sx,sy]=srcPts[i], [dx,dy]=dstPts[i];
    A.push([-sx,-sy,-1, 0,  0,  0, dx*sx, dx*sy, dx]);
    A.push([ 0,  0,  0,-sx,-sy,-1, dy*sx, dy*sy, dy]);
  }
  const h = _gaussElim(A);
  if (!h) return null;
  // H = [h0..h7, 1]
  const H = [...h, 1];

  // Compute inverse of H
  const [h0,h1,h2,h3,h4,h5,h6,h7,h8] = H;
  const det = h0*(h4*h8-h5*h7) - h1*(h3*h8-h5*h6) + h2*(h3*h7-h4*h6);
  if (Math.abs(det)<1e-10) return null;
  const inv = [
    (h4*h8-h5*h7)/det, (h2*h7-h1*h8)/det, (h1*h5-h2*h4)/det,
    (h5*h6-h3*h8)/det, (h0*h8-h2*h6)/det, (h2*h3-h0*h5)/det,
    (h3*h7-h4*h6)/det, (h1*h6-h0*h7)/det, (h0*h4-h1*h3)/det,
  ];

  const sd = srcImageData.data;
  const dst = new ImageData(outSize, outSize);
  const dd = dst.data;

  for (let dy=0; dy<outSize; dy++) {
    for (let dx=0; dx<outSize; dx++) {
      const w2 = inv[6]*dx + inv[7]*dy + inv[8];
      const sx = (inv[0]*dx + inv[1]*dy + inv[2]) / w2;
      const sy = (inv[3]*dx + inv[4]*dy + inv[5]) / w2;
      const six=Math.round(sx), siy=Math.round(sy);
      if (six>=0 && six<srcW && siy>=0 && siy<srcH) {
        const si=(siy*srcW+six)*4, di=(dy*outSize+dx)*4;
        dd[di]=sd[si]; dd[di+1]=sd[si+1]; dd[di+2]=sd[si+2]; dd[di+3]=255;
      }
    }
  }
  return dst;
}

function _gaussElim(A) {
  const n=A.length;
  for (let col=0; col<n; col++) {
    let maxR=col;
    for (let r=col+1; r<n; r++)
      if (Math.abs(A[r][col])>Math.abs(A[maxR][col])) maxR=r;
    [A[col],A[maxR]]=[A[maxR],A[col]];
    const piv=A[col][col];
    if (Math.abs(piv)<1e-10) return null;
    for (let r=0; r<n; r++) {
      if (r===col) continue;
      const f=A[r][col]/piv;
      for (let c=col; c<=n; c++) A[r][c]-=f*A[col][c];
    }
    for (let c=col; c<=n; c++) A[col][c]/=piv;
  }
  return A.map(r=>r[n]);
}

// ═══════════════════════════════════════════════════════
// BINARISATION — Otsu global threshold
// ZXing uses HybridBinarizer (local) but Otsu is robust enough
// for a well-printed DataMatrix with sufficient contrast
// ═══════════════════════════════════════════════════════
function otsuThreshold(grey, w, h) {
  const hist = new Int32Array(256);
  for (let i=0; i<grey.length; i++) hist[grey[i]]++;
  const total = w*h;
  let sum=0;
  for (let i=0; i<256; i++) sum+=i*hist[i];
  let sumB=0, wB=0, max=0, thresh=0;
  for (let t=0; t<256; t++) {
    wB+=hist[t]; if(!wB) continue;
    const wF=total-wB; if(!wF) break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if (between>max) { max=between; thresh=t; }
  }
  return thresh;
}

function toBitMatrix(grey, w, h, thresh) {
  const data = new Uint8Array(w*h);
  for (let i=0; i<grey.length; i++) data[i] = grey[i]<=thresh ? 1 : 0;
  return new BitMatrix(w, h, data);
}

function toGrey(imageData) {
  const { data, width, height } = imageData;
  const out = new Uint8Array(width*height);
  for (let i=0; i<out.length; i++) {
    const o=i*4;
    out[i] = (data[o]*77 + data[o+1]*150 + data[o+2]*29) >> 8;
  }
  return out;
}

// ═══════════════════════════════════════════════════════
// ORIENTATION — use L-corner (solid sides = fewer transitions)
// ═══════════════════════════════════════════════════════
function detectOrientation(corners) {
  // DMDetector already finds orientation via solid side detection
  // topLeft = corner of the L (two solid sides meet there for standard DM)
  // The corners returned are already canonical: TL, BL, BR, TR
  return 'L-corner at TL (canonical DataMatrix orientation)';
}

// ═══════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════
const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const oCtx    = overlay.getContext('2d');
const procC   = document.getElementById('proc-c');
const pCtx    = procC.getContext('2d', { willReadFrequently: true });
const cropC   = document.getElementById('crop-canvas');
const cCtx    = cropC.getContext('2d');
const debugC  = document.getElementById('debug-canvas');
const dCtx    = debugC.getContext('2d');

const PROC_W=480, PROC_H=270, OUT_SZ=200;
procC.width=PROC_W; procC.height=PROC_H;

let fCount=0, lastFPS=0, lastFPSt=0;
let missCount=0;

// ═══════════════════════════════════════════════════════
// MULTI-FRAME CAPTURE STATE MACHINE
// scanning -> capturing (collecting N good frames) -> done (locked result)
// Once locked, further frames are ignored until reset.
// ═══════════════════════════════════════════════════════
const CAPTURE_TARGET = 15;
let phase = 'scanning';      // 'scanning' | 'capturing' | 'done'
let capturedFrames = [];     // array of ImageData, all same orientation/size
let captureMeta = null;      // last good corners/orientation info for display

document.getElementById('reset-btn').addEventListener('click', () => {
  phase = 'scanning';
  capturedFrames = [];
  captureMeta = null;
  document.getElementById('reset-btn').style.display = 'none';
  document.getElementById('capture-progress').style.display = 'none';
  clearResult();
  setStatus('Scanning…', '#ffaa00');
});

// ═══════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════
async function startCamera() {
  setStatus('Requesting camera…','#555');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });
    video.srcObject = stream;
    await new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true}));
    await video.play();
    setStatus('Scanning…','#ffaa00');
    requestAnimationFrame(loop);
  } catch(e) {
    setStatus('Camera error: '+e.message,'#ff4444');
  }
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(ts) {
  requestAnimationFrame(loop);

  // FPS
  fCount++;
  if (ts-lastFPSt >= 1000) {
    lastFPS=fCount; fCount=0; lastFPSt=ts;
    document.getElementById('fps').textContent=lastFPS+' fps';
  }

  const cr = document.getElementById('cam-wrap').getBoundingClientRect();
  overlay.width=cr.width; overlay.height=cr.height;

  if (video.readyState < 2) return;

  const vw=video.videoWidth, vh=video.videoHeight;
  const t0=performance.now();

  // DIAGNOSTIC: check for orientation mismatch between raw sensor frame
  // and what's actually displayed. If videoW/H aspect ratio doesn't match
  // the displayed cam-wrap aspect ratio, the raw frame data we process is
  // rotated relative to what you see on screen — this breaks cropping.
  const videoAspect = vw / vh;
  const displayAspect = cr.width / cr.height;
  const aspectMismatch = Math.abs(videoAspect - displayAspect) > 0.3 &&
                          Math.abs(videoAspect - (1/displayAspect)) < 0.3;

  // ── 1. Downsample to PROC size ──
  const sc=Math.min(PROC_W/vw, PROC_H/vh);
  const sw=Math.round(vw*sc), sh=Math.round(vh*sc);
  pCtx.drawImage(video, 0, 0, sw, sh);
  const frame = pCtx.getImageData(0, 0, sw, sh);

  // ── 2. Greyscale + Otsu threshold → BitMatrix ──
  const grey   = toGrey(frame);
  const thresh = otsuThreshold(grey, sw, sh);
  const bitmat = toBitMatrix(grey, sw, sh, thresh);

  // Ensure a white quiet zone at frame edges so WRD terminates correctly
  // (clears 8px border of the bitmatrix to white = 0)
  const QZ = 8;
  for (let y=0; y<sh; y++) {
    for (let x=0; x<sw; x++) {
      if (x<QZ || x>=sw-QZ || y<QZ || y>=sh-QZ) {
        bitmat._data[y*sw+x] = 0; // force white
      }
    }
  }
  const t1=performance.now();
  setTime('t0', t1-t0);

  // ── 3. COMBINED DETECTION ──
  // ZXing's WhiteRectangleDetector traces exact black/white transitions,
  // which breaks on thick blocky timing-strip dots. A coarse-grid
  // connected-component scan is more robust: it divides the frame into
  // small blocks, marks blocks with meaningful black density as "active",
  // dilates slightly to bridge a SINGLE marker's own internal gaps
  // (white square, spacing between dots), then flood-fills to find
  // distinct connected regions — picking whichever is closest to center.
  // This correctly handles two failure modes verified in testing:
  //   1. Two separate markers with a gap between them (dilation is small
  //      enough to NOT bridge that gap — they stay separate components)
  //   2. A single marker's internal structure (border/dots/anchor/noise
  //      are disconnected black regions, but dilation bridges them into
  //      one component since the gaps between them are much smaller than
  //      the gap between separate markers)
  function findBoundingBox(bitmat, w, h) {
    const margin = 0.15;
    const x0 = Math.round(w*margin), x1 = Math.round(w*(1-margin));
    const y0 = Math.round(h*margin), y1 = Math.round(h*(1-margin));

    const BLOCK = Math.max(4, Math.round(Math.min(w,h) * 0.02));
    const gw = Math.ceil((x1-x0)/BLOCK), gh = Math.ceil((y1-y0)/BLOCK);
    const density = new Float32Array(gw*gh);

    for (let gy=0; gy<gh; gy++) {
      for (let gx=0; gx<gw; gx++) {
        let black=0, total=0;
        const bx0=x0+gx*BLOCK, by0=y0+gy*BLOCK;
        for (let y=by0; y<Math.min(by0+BLOCK,y1); y++)
          for (let x=bx0; x<Math.min(bx0+BLOCK,x1); x++)
            { if(bitmat.get(x,y)) black++; total++; }
        density[gy*gw+gx] = total>0 ? black/total : 0;
      }
    }

    const ACTIVE_THRESH = 0.06;
    const activeOrig = new Uint8Array(gw*gh);
    for (let i=0;i<density.length;i++) activeOrig[i] = density[i]>ACTIVE_THRESH ? 1 : 0;

    const DILATE_R = Math.max(2, Math.round(Math.min(gw,gh) * 0.06));
    function dilate(grid, gw, gh, r) {
      const out = new Uint8Array(gw*gh);
      for (let gy=0; gy<gh; gy++) for (let gx=0; gx<gw; gx++) {
        if (grid[gy*gw+gx]) { out[gy*gw+gx]=1; continue; }
        let found=false;
        for (let dy=-r; dy<=r && !found; dy++)
          for (let dx=-r; dx<=r && !found; dx++) {
            const nx=gx+dx, ny=gy+dy;
            if (nx>=0&&nx<gw&&ny>=0&&ny<gh&&grid[ny*gw+nx]) found=true;
          }
        out[gy*gw+gx]=found?1:0;
      }
      return out;
    }
    const activeDilated = dilate(activeOrig, gw, gh, DILATE_R);

    // Flood-fill using the DILATED grid for connectivity (bridges a single
    // marker's internal gaps), but measure the final bbox extent using
    // only ORIGINALLY-active cells (dilation is for connectivity only,
    // not for inflating the measured size beyond the true marker extent).
    const visited = new Uint8Array(gw*gh);
    const components = [];
    for (let gy=0; gy<gh; gy++) {
      for (let gx=0; gx<gw; gx++) {
        const idx = gy*gw+gx;
        if (activeDilated[idx] && !visited[idx]) {
          const stack=[[gx,gy]]; visited[idx]=1;
          const cells=[];
          while(stack.length) {
            const [cx,cy]=stack.pop();
            cells.push([cx,cy]);
            for (const [nx,ny] of [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]]) {
              if (nx>=0&&nx<gw&&ny>=0&&ny<gh) {
                const nidx=ny*gw+nx;
                if (activeDilated[nidx] && !visited[nidx]) { visited[nidx]=1; stack.push([nx,ny]); }
              }
            }
          }
          let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity, origCount=0;
          for (const [cx,cy] of cells) {
            if (activeOrig[cy*gw+cx]) {
              minX=Math.min(minX,cx); maxX=Math.max(maxX,cx);
              minY=Math.min(minY,cy); maxY=Math.max(maxY,cy);
              origCount++;
            }
          }
          if (origCount>0) components.push({minX,maxX,minY,maxY,count:origCount});
        }
      }
    }

    if (components.length===0) return {left:-1,right:-1,top:-1,bottom:-1};

    // Pick whichever connected component is closest to frame center —
    // that's the one the guide box is pointing at.
    const centerGX=gw/2, centerGY=gh/2;
    let best=components[0], bestDist=Infinity;
    for (const c of components) {
      const midX=(c.minX+c.maxX)/2, midY=(c.minY+c.maxY)/2;
      const dist=Math.hypot(midX-centerGX, midY-centerGY);
      if (dist<bestDist) { bestDist=dist; best=c; }
    }

    return {
      left:   x0+best.minX*BLOCK,
      right:  x0+(best.maxX+1)*BLOCK,
      top:    y0+best.minY*BLOCK,
      bottom: y0+(best.maxY+1)*BLOCK,
    };
  }

  const bbox = findBoundingBox(bitmat, sw, sh);
  if (bbox.left<0 || bbox.right<0 || bbox.top<0 || bbox.bottom<0) {
    drawDebugPanel(bitmat, sw, sh, null, null, null, false);
    dbg('No marker-like region found');
    missCount++;
    if (missCount>5) clearResult();
    setTime('t1',performance.now()-t1);
    return;
  }

  const qW = bbox.right - bbox.left;
  const qH = bbox.bottom - bbox.top;

  // Reject false positives: too small, too large, or not roughly square
  if (qW < sw*0.10 || qW > sw*0.90 || qH < sh*0.10 || qH > sh*0.90) {
    drawDebugPanel(bitmat, sw, sh, bbox, null, null, false);
    dbg('Rejected — size out of range ('+qW+'x'+qH+')');
    missCount++;
    if (missCount>5) clearResult();
    setTime('t1',performance.now()-t1);
    return;
  }
  const aspect = qW/qH;
  if (aspect < 0.7 || aspect > 1.43) {
    drawDebugPanel(bitmat, sw, sh, bbox, null, null, false);
    dbg('Rejected — not square (aspect='+aspect.toFixed(2)+')');
    missCount++;
    if (missCount>5) clearResult();
    setTime('t1',performance.now()-t1);
    return;
  }

  // ── STRUCTURAL SIGNATURE CHECK ──
  // Generic size/aspect checks alone accept ANY square high-contrast blob
  // (bookshelves, laptops, clutter all pass those). This marker has a very
  // specific signature: 2 sides with ONE continuous solid black run
  // (the L-border), and 2 sides with MULTIPLE similar-sized black segments
  // (the timing-strip dots) — OR all 4 sides solid for uniform-border
  // designs. Real-world background clutter essentially never reproduces
  // this exact combination. Verified: real marker (both full-scale and
  // tiny/phone-scale) → passes; random noise/clutter → fails.
  function analyzeEdgeLine(x1,y1,x2,y2) {
    const steps = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
    const segs = []; let inBlack=false, runStart=0;
    for (let i=0;i<=steps;i++) {
      const x=Math.round(x1+(x2-x1)*i/steps), y=Math.round(y1+(y2-y1)*i/steps);
      const black=bitmat.get(x,y);
      if (black && !inBlack) { runStart=i; inBlack=true; }
      if (!black && inBlack) { segs.push(i-runStart); inBlack=false; }
    }
    if (inBlack) segs.push(steps-runStart);
    return segs;
  }
  function classifyEdgeSegs(segs, edgeLen) {
    if (segs.length===0) return 'empty';
    const cov = segs.reduce((a,b)=>a+b,0)/edgeLen;
    if (segs.length<=2 && cov>0.80) return 'solid';
    if (segs.length>=3 && cov>0.25 && cov<0.85) return 'alternating';
    return 'other';
  }

  const sigInset = Math.max(3, Math.round(Math.min(qW,qH) * 0.07));
  const il=bbox.left+sigInset, ir=bbox.right-sigInset;
  const it=bbox.top+sigInset,  ib=bbox.bottom-sigInset;
  let isMarkerLike = false;
  if (ir>il && ib>it) {
    const hLen=ir-il, vLen=ib-it;
    const cTop    = classifyEdgeSegs(analyzeEdgeLine(il,it,ir,it), hLen);
    const cBottom = classifyEdgeSegs(analyzeEdgeLine(il,ib,ir,ib), hLen);
    const cLeft   = classifyEdgeSegs(analyzeEdgeLine(il,it,il,ib), vLen);
    const cRight  = classifyEdgeSegs(analyzeEdgeLine(ir,it,ir,ib), vLen);
    const classes = [cTop,cBottom,cLeft,cRight];
    const solidCount = classes.filter(c=>c==='solid').length;
    const altCount = classes.filter(c=>c==='alternating').length;
    const emptyCount = classes.filter(c=>c==='empty').length;
    isMarkerLike = emptyCount===0 && ((solidCount>=2 && altCount>=1) || solidCount>=3);

    // Always render the debug panel — shows exactly what the algorithm
    // is seeing and why it accepted/rejected, regardless of outcome.
    drawDebugPanel(bitmat, sw, sh, bbox, {top:cTop,bottom:cBottom,left:cLeft,right:cRight},
                    {il,it,ir,ib}, isMarkerLike);

    if (!isMarkerLike) {
      dbg('Rejected — no border signature (top='+cTop+' bottom='+cBottom+' left='+cLeft+' right='+cRight+')');
      missCount++;
      if (missCount>5) clearResult();
      setTime('t1',performance.now()-t1);
      return;
    }
  } else {
    drawDebugPanel(bitmat, sw, sh, bbox, null, null, false);
    dbg('Rejected — too small for signature check');
    missCount++;
    if (missCount>5) clearResult();
    setTime('t1',performance.now()-t1);
    return;
  }

  const t2=performance.now();
  missCount=0;
  setTime('t1', t2-t1);

  // Default axis-aligned corners from the bounding box
  let tl={x:bbox.left,  y:bbox.top};
  let tr={x:bbox.right, y:bbox.top};
  let br={x:bbox.right, y:bbox.bottom};
  let bl={x:bbox.left,  y:bbox.bottom};

  // Try ZXing purely for orientation (which corner is the true TL) —
  // failure here is non-fatal, we just keep default orientation.
  let orientLabel = 'default (ZXing unavailable)';
  try {
    const bcx = Math.round((bbox.left+bbox.right)/2);
    const bcy = Math.round((bbox.top+bbox.bottom)/2);
    const gInit = Math.max(20, Math.round(qW * 0.3));
    const zDetector = new DMDetector(bitmat, gInit, bcx, bcy);
    const zResult = zDetector.detectCorners();
    const ztl = {x:zResult.topLeft.getX(), y:zResult.topLeft.getY()};
    // Find which bbox corner is nearest to ZXing's detected TL —
    // that tells us the true rotation of the marker.
    const bboxCorners = [
      {x:bbox.left,  y:bbox.top,    label:'TL', arr:[tl,tr,br,bl]},
      {x:bbox.right, y:bbox.top,    label:'TR', arr:[tr,br,bl,tl]},
      {x:bbox.right, y:bbox.bottom, label:'BR', arr:[br,bl,tl,tr]},
      {x:bbox.left,  y:bbox.bottom, label:'BL', arr:[bl,tl,tr,br]},
    ];
    let nearest = bboxCorners[0], minDist = Infinity;
    for (const c of bboxCorners) {
      const d = MathUtils.distance(ztl.x, ztl.y, c.x, c.y);
      if (d < minDist) { minDist = d; nearest = c; }
    }
    [tl, tr, br, bl] = nearest.arr;
    orientLabel = nearest.label + ' (ZXing-confirmed)';
  } catch(e) {
    orientLabel = 'default (ZXing: '+e.message+')';
  }

  dbg('bbox='+qW+'x'+qH+' orient='+orientLabel);

  // Draw overlay — scale from downsampled (sw,sh) coords to display coords
  const dsx=cr.width/sw, dsy=cr.height/sh;
  drawQuad(oCtx,[tl,tr,br,bl],dsx,dsy);

  // ── 4. Perspective warp — reuse the SAME frame ImageData used for detection ──
  // No second capture. Corners are already in (sw,sh) space matching `frame`.
  const warped = perspectiveWarp(frame, sw, sh, [tl,tr,br,bl], OUT_SZ);
  const t3=performance.now();
  setTime('t2',t3-t2);
  setTime('tt',t3-t0);

  if (warped) {
    // ── If already locked on a final result, ignore further frames ──
    if (phase === 'done') return;

    // ── Start capturing on first good detection ──
    if (phase === 'scanning') {
      phase = 'capturing';
      capturedFrames = [];
      document.getElementById('capture-progress').style.display = 'flex';
      document.getElementById('empty').style.display = 'none';
    }

    if (phase === 'capturing') {
      capturedFrames.push(warped);
      captureMeta = { tl, tr, br, bl };
      const n = capturedFrames.length;
      const pct = Math.min(100, Math.round(n/CAPTURE_TARGET*100));
      document.getElementById('capture-bar-fill').style.width = pct+'%';
      document.getElementById('capture-progress-text').textContent =
        'Capturing '+n+'/'+CAPTURE_TARGET+'…';

      // Show a live preview of the latest frame while capturing
      cCtx.putImageData(warped,0,0);

      if (n >= CAPTURE_TARGET) {
        finalizeCapture();
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
// FINALIZE — average all captured frames pixel-wise to reduce
// motion blur / noise, then lock the result and stop scanning.
// ═══════════════════════════════════════════════════════
function finalizeCapture() {
  const n = capturedFrames.length;
  const sz = OUT_SZ;
  const sum = new Float32Array(sz*sz*3);
  for (const frame of capturedFrames) {
    const d = frame.data;
    for (let i=0, p=0; i<d.length; i+=4, p+=3) {
      sum[p]   += d[i];
      sum[p+1] += d[i+1];
      sum[p+2] += d[i+2];
    }
  }
  const avg = new ImageData(sz, sz);
  const ad = avg.data;
  for (let i=0, p=0; i<ad.length; i+=4, p+=3) {
    ad[i]   = sum[p]/n;
    ad[i+1] = sum[p+1]/n;
    ad[i+2] = sum[p+2]/n;
    ad[i+3] = 255;
  }
  cCtx.putImageData(avg, 0, 0);

  document.getElementById('capture-progress').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'block';

  phase = 'done';
  if (captureMeta) {
    showResult(captureMeta.tl, captureMeta.tr, captureMeta.br, captureMeta.bl);
  }
  setStatus('Locked ✓', '#00e5a0');
  dbg('Captured '+n+' frames, averaged — locked. Tap "Scan again" to rescan.');
}

// ═══════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════
function drawQuad(ctx, pts, sx, sy) {
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  const scaled = pts.map(p=>({x:p.x*sx, y:p.y*sy}));
  const t=(Date.now()%800)/800;
  ctx.save();
  ctx.setLineDash([8,4]);
  ctx.lineDashOffset=-t*24;
  ctx.strokeStyle='#00e5a0';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(scaled[0].x, scaled[0].y);
  for(let i=1;i<scaled.length;i++) ctx.lineTo(scaled[i].x,scaled[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#00e5a0';
  scaled.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}

function showResult(tl, tr, br, bl) {
  document.getElementById('empty').style.display='none';
  cropC.style.display='block';
  document.getElementById('info').style.display='flex';
  const sz=Math.round(MathUtils.distance(tl.x,tl.y,tr.x,tr.y));
  document.getElementById('i-corners').textContent=
    `TL(${Math.round(tl.x)},${Math.round(tl.y)})`;
  document.getElementById('i-size').textContent=sz+'px wide';
  document.getElementById('i-rot').textContent='Canonical (ZXing L-corner)';
  document.getElementById('i-time').textContent=
    new Date().toLocaleTimeString('en-GB',{hour12:false});
  setStatus('Detected','#00e5a0');
}

function clearResult() {
  document.getElementById('empty').style.display='flex';
  cropC.style.display='none';
  document.getElementById('info').style.display='none';
  oCtx.clearRect(0,0,overlay.width,overlay.height);
  setStatus('Scanning…','#ffaa00');
}

function setStatus(txt,col) {
  document.getElementById('stxt').textContent=txt;
  document.getElementById('dot').style.background=col;
}

function setTime(id, ms) {
  const el=document.getElementById(id);
  if (el) el.textContent = ms!=null ? ms.toFixed(1)+'ms' : '—';
}

function dbg(msg) { document.getElementById('dbg').textContent=msg; }
function fmt(rp) { return Math.round(rp.getX())+','+Math.round(rp.getY()); }

// ═══════════════════════════════════════════════════════
// DEBUG VISUALIZATION — shows the actual binarized frame,
// detected bbox, and the 4 edge classification lines
// (solid=green, alternating=blue, other/empty=red)
// ═══════════════════════════════════════════════════════
function drawDebugPanel(bitmat, w, h, bbox, edgeClasses, inset, accepted) {
  const cw = debugC.width, ch = debugC.height;
  dCtx.clearRect(0,0,cw,ch);

  // ZOOM into the candidate region (bbox + generous padding) instead of
  // showing the whole frame. The crop region is forced SQUARE (using the
  // larger of width/height, padded equally) so the debug canvas never
  // shows a letterboxed/distorted rectangle regardless of the bbox's
  // actual aspect ratio.
  let cropL, cropT, cropR, cropB;
  if (bbox && bbox.left>=0) {
    const bcx = (bbox.left+bbox.right)/2, bcy = (bbox.top+bbox.bottom)/2;
    const bw = bbox.right-bbox.left, bh = bbox.bottom-bbox.top;
    const half = Math.round(Math.max(bw,bh) * 0.65); // half-size incl. padding
    cropL = Math.max(0, bcx - half);
    cropT = Math.max(0, bcy - half);
    cropR = Math.min(w, bcx + half);
    cropB = Math.min(h, bcy + half);
    // If clamped against frame edge, re-square by pulling the opposite
    // side in rather than leaving a non-square crop
    const finalW = cropR-cropL, finalH = cropB-cropT;
    if (finalW !== finalH) {
      const side = Math.min(finalW, finalH);
      cropR = cropL + side;
      cropB = cropT + side;
    }
  } else {
    // No candidate — zoom to center square region matching the guide box
    const side = Math.round(Math.min(w,h) * 0.4);
    const cx = w/2, cy = h/2;
    cropL = Math.round(cx - side/2); cropR = cropL + side;
    cropT = Math.round(cy - side/2); cropB = cropT + side;
  }
  const cropW = cropR-cropL, cropH = cropB-cropT;
  const scale = Math.min(cw/cropW, ch/cropH);
  const offX = (cw - cropW*scale)/2, offY = (ch - cropH*scale)/2;

  const img = dCtx.createImageData(cw, ch);
  const data = img.data;
  for (let cy=0; cy<ch; cy++) {
    for (let cx=0; cx<cw; cx++) {
      const srcX = cropL + Math.floor((cx-offX)/scale);
      const srcY = cropT + Math.floor((cy-offY)/scale);
      const di = (cy*cw+cx)*4;
      if (srcX>=cropL && srcX<cropR && srcY>=cropT && srcY<cropB && srcX>=0 && srcX<w && srcY>=0 && srcY<h) {
        const isBlack = bitmat.get(srcX, srcY);
        const v = isBlack ? 20 : 235;
        data[di]=v; data[di+1]=v; data[di+2]=v; data[di+3]=255;
      } else {
        data[di]=10; data[di+1]=10; data[di+2]=14; data[di+3]=255;
      }
    }
  }
  dCtx.putImageData(img, 0, 0);

  function toCanvas(x,y) { return [offX+(x-cropL)*scale, offY+(y-cropT)*scale]; }

  if (bbox && bbox.left>=0) {
    const [x1,y1] = toCanvas(bbox.left, bbox.top);
    const [x2,y2] = toCanvas(bbox.right, bbox.bottom);
    dCtx.strokeStyle = accepted ? '#00e5a0' : 'rgba(255,255,255,0.5)';
    dCtx.lineWidth = 1.5;
    dCtx.setLineDash([4,3]);
    dCtx.strokeRect(x1, y1, x2-x1, y2-y1);
    dCtx.setLineDash([]);
  }

  if (bbox && edgeClasses && inset) {
    const colorFor = c => c==='solid' ? '#00e5a0' : c==='alternating' ? '#3ea6ff' : '#ff4444';
    const { il, it, ir, ib } = inset;
    const lines = [
      [il,it,ir,it, edgeClasses.top,    'T', (il+ir)/2, it],
      [il,ib,ir,ib, edgeClasses.bottom, 'B', (il+ir)/2, ib],
      [il,it,il,ib, edgeClasses.left,   'L', il, (it+ib)/2],
      [ir,it,ir,ib, edgeClasses.right,  'R', ir, (it+ib)/2],
    ];
    dCtx.font = 'bold 11px monospace';
    dCtx.textAlign = 'center';
    dCtx.textBaseline = 'middle';
    for (const [x1,y1,x2,y2,cls,label,lx,ly] of lines) {
      const [cx1,cy1] = toCanvas(x1,y1);
      const [cx2,cy2] = toCanvas(x2,y2);
      const col = colorFor(cls);
      dCtx.strokeStyle = col;
      dCtx.lineWidth = 2.5;
      dCtx.beginPath();
      dCtx.moveTo(cx1,cy1);
      dCtx.lineTo(cx2,cy2);
      dCtx.stroke();
      // Explicit T/B/L/R label so there's no ambiguity about which
      // line corresponds to which side of the marker.
      const [lcx,lcy] = toCanvas(lx,ly);
      dCtx.fillStyle = '#000';
      dCtx.fillRect(lcx-8, lcy-8, 16, 16);
      dCtx.fillStyle = col;
      dCtx.fillText(label, lcx, lcy);
    }
  }

  debugC.style.borderColor = accepted ? '#00e5a0' : 'var(--border)';
}

// ── Boot ──
startCamera();
